# This workflow is required and run as part of an org-wide ruleset

name: Dependency Auto-Merge
on:
  pull_request:
  merge_group:

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  dependabot:
    name: Auto-Merge Dependabot PR
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Read this repository's auto-merge policy
        id: policy
        uses: ibm-skills-network/.github/.github/actions/auto-merge-policy@main
        with:
          source: dependabot
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        # A major upgrade is the one class of change a passing test suite is least likely
        # to catch, so it goes to a person. This guard was present but commented out.
        # Requires that auto-merge is enabled for the repository
        if: >-
          ${{ steps.policy.outputs.enabled == 'true'
              && steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve PR
        if: >-
          ${{ steps.policy.outputs.enabled == 'true'
              && steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  mend:
    name: Auto-Merge Mend PR
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'ibm-mend-app[bot]' }}
    steps:
      # No major version gate here, deliberately. Mend Renovate never opens a major
      # upgrade in this organisation: repo-config.json in ibm-skills-network/mend-config
      # extends ":disableMajorUpdates", so majors are suppressed at the source rather
      # than filtered here. There is no equivalent of dependabot/fetch-metadata for
      # Renovate, and a gate inferred from the pull request title would be guesswork.
      # If that config line is ever removed, this job needs a real gate before it.
      - name: Read this repository's auto-merge policy
        id: policy
        uses: ibm-skills-network/.github/.github/actions/auto-merge-policy@main
        with:
          source: renovate
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        # Requires that auto-merge is enabled for the repository
        if: ${{ steps.policy.outputs.enabled == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve PR
        if: ${{ steps.policy.outputs.enabled == 'true' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  mend-remediation:
    name: Auto-Merge Mend Remediation PR
    runs-on: ubuntu-latest
    # Both conditions are needed. The branch prefix alone is spoofable by anyone with
    # write access; the author alone would also match a hand-pushed branch from the
    # same identity. The login lives in an org variable rather than inline because the
    # remediation tool's identity changes when the escalation agent moves it to a
    # GitHub App, and that should not mean another pull request against this file.
    # An unset variable matches nothing, which leaves auto-merge off.
    if: >-
      ${{ startsWith(github.event.pull_request.head.ref, 'mend-remediate/')
          && github.event.pull_request.user.login == vars.MEND_REMEDIATION_ACTOR }}
    steps:
      - name: Read this repository's auto-merge policy
        id: policy
        uses: ibm-skills-network/.github/.github/actions/auto-merge-policy@main
        with:
          source: mend-remediation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        # Requires that auto-merge is enabled for the repository
        if: ${{ steps.policy.outputs.enabled == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve PR
        if: ${{ steps.policy.outputs.enabled == 'true' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
