# Same gotcha as the Jira check: a ruleset-run workflow only ever receives opened, synchronize
# and reopened. Any `types:` written here is ignored, and nothing can run at merge time.
name: Detect Secrets

on:
  pull_request:
  merge_group:

concurrency:
  group: detect-secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write # Adding a label the repo does not have yet creates it, and making labels needs Issues.

jobs:
  detect-secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      # Lets us find the comment we left last time and edit it, instead of stacking up new ones.
      MARKER: '<!-- detect-secrets-check -->'
      # Flip to 'true' once every repo has an audited baseline. Until then a repo without one
      # passes with a notice, so this check can go live org-wide while the rollout is only
      # partway through. Repos that already have a baseline are enforced from day one.
      REQUIRE_BASELINE: 'false'
      # Pinned because the repo's tags lag master badly: shipping builds are 0.13.1+ibm.N.dss
      # while the newest tag is still v0.13.1. Bump this deliberately.
      DETECT_SECRETS_REF: 38ba7e335083e0a4db8c53e9be414795b27891e9

    steps:
      - uses: actions/checkout@v4

      # Dependency bots are NOT exempt here, unlike the Jira check. A bot cannot write a ticket
      # key, but it can absolutely commit a secret, and the scan costs a few seconds.
      - name: Look for a baseline
        id: baseline
        run: |
          set -euo pipefail
          if [ -f .secrets.baseline ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Handle a repository with no baseline
        if: steps.baseline.outputs.present == 'false'
        run: |
          set -euo pipefail
          if [ "$REQUIRE_BASELINE" = "true" ]; then
            echo "::error::This repository has no .secrets.baseline, and every repository is now required to have one."
            exit 1
          fi
          echo "::notice::No .secrets.baseline here, so secret scanning is not enforced in this repository yet."

      - uses: actions/setup-python@v5
        if: steps.baseline.outputs.present == 'true'
        with:
          python-version: '3.12'

      # Install failures warn and pass rather than block. If PyPI or GitHub is having a bad
      # morning, blocking every pull request in 150 repositories is worse than a few hours of
      # unscanned ones, and the pre-commit hook still covers developers locally. A scan that
      # runs and finds something is a different matter and always blocks.
      - name: Install IBM detect-secrets
        id: install
        if: steps.baseline.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --quiet --upgrade \
            "git+https://github.com/ibm/detect-secrets.git@${DETECT_SECRETS_REF}#egg=detect-secrets"
          detect-secrets --version

      - name: Report an install that did not work
        if: steps.baseline.outputs.present == 'true' && steps.install.outcome == 'failure'
        run: echo "::warning::Could not install detect-secrets, so this pull request was not scanned. Reported for remediation."

      - name: Scan and enforce
        id: scan
        if: steps.baseline.outputs.present == 'true' && steps.install.outcome == 'success'
        run: |
          set -uo pipefail

          # Upstream Yelp detect-secrets installs under the same command name but carries none of
          # the IBM detectors (Cloud IAM, COS HMAC, Cloudant, Softlayer, GHE). Its v1.x baseline
          # format is unreadable here too: `scan --update` dies on a bare `raise IOError`.
          VERSION=$(python3 -c "import json; print(json.load(open('.secrets.baseline')).get('version',''))")
          echo "baseline version: $VERSION"
          case "$VERSION" in
            *ibm*) ;;
            *)
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              {
                echo "problem<<EOF"
                echo "\`.secrets.baseline\` came from upstream detect-secrets (\`$VERSION\`), not IBM's fork."
                echo ""
                echo "Delete it and regenerate. There is no conversion between the two formats."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "::error::Baseline is not from the IBM fork."
              exit 1 ;;
          esac

          # --update rewrites the baseline in place, keeping the exclusions it already records,
          # and adds anything new with no verdict attached. So a secret this pull request adds
          # lands as an unaudited entry, which the audit below then refuses.
          detect-secrets scan --update .secrets.baseline

          # Three ways to fail: a finding nobody has ruled on (including whatever the scan just
          # added), a secret the scanner confirmed still works, or one somebody marked genuine
          # and left in the code.
          OUTPUT=$(detect-secrets audit --report \
            --fail-on-unaudited --fail-on-live --fail-on-audited-real \
            --omit-instructions .secrets.baseline 2>&1)
          STATUS=$?
          echo "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "Secret scan passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "blocked=true" >> "$GITHUB_OUTPUT"
          {
            echo "problem<<EOF"
            echo "The secret scan found something this pull request has not accounted for."
            echo ""
            echo '```'
            printf '%s\n' "$OUTPUT" | head -40
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::error::Secret scan failed."
          exit 1

      - name: Label the pull request
        if: always() && steps.baseline.outputs.present == 'true' && steps.install.outcome == 'success'
        env:
          BLOCKED: ${{ steps.scan.outputs.blocked }}
        run: |
          set -euo pipefail
          # Adding a label creates it if the repo does not have it yet. Removing one the pull
          # request does not carry gives a 404, which is fine and can be ignored.
          add() { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" >/dev/null || \
                    echo "::warning::could not add the $1 label"; }
          remove() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/$1" >/dev/null 2>&1 || true; }
          if [ "$BLOCKED" = "true" ]; then add secrets-blocked; else remove secrets-blocked; fi

      - name: Explain the block, or withdraw the explanation
        if: always() && steps.baseline.outputs.present == 'true' && steps.install.outcome == 'success'
        env:
          BLOCKED: ${{ steps.scan.outputs.blocked }}
          PROBLEM: ${{ steps.scan.outputs.problem }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains(env.MARKER))) | .id' \
            | awk 'NR==1') || existing=""

          if [ "$BLOCKED" != "true" ]; then
            # Nothing wrong any more. Take the comment down.
            if [ -n "$existing" ]; then
              gh api -X DELETE "repos/$REPO/issues/comments/$existing" >/dev/null &&
                echo "Removed the block comment." || echo "::warning::could not remove the block comment"
            fi
            exit 0
          fi

          # Built line by line rather than with a heredoc: heredoc contents have to start at
          # column 0, and that ends the YAML block this whole script lives in.
          fix=$(printf '%s\n' \
            '**If it is a real secret:** take it out of the code, revoke the credential, then re-scan. Do not put it in the baseline.' \
            '' \
            '**If it is a false positive on one line:** add a `pragma: allowlist secret` comment to that line.' \
            '' \
            '**If there are several:** re-scan, record your verdicts, and commit the baseline.' \
            '' \
            '    detect-secrets scan --update .secrets.baseline' \
            '    detect-secrets audit .secrets.baseline' \
            '' \
            'The baseline is an audit record, not an allowlist. Every entry carries a verdict because somebody looked at it, and this check refuses any entry that does not.')
          body=$(printf '%s\n%s\n\n%s\n' "$MARKER" "$PROBLEM" "$fix")

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null &&
              echo "Updated the block comment." || echo "::warning::could not update the block comment"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null &&
              echo "Explained the block." || echo "::warning::could not post the block comment"
          fi
