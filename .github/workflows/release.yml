on:
  workflow_call:
    inputs:
      image:
        description: "Full docker image location. e.g. us.icr.io/skills-network-portals/curator"
        required: true
        type: string
      scan_image_enabled:
        description: "Set to true to scan your container image for vulnerabilities before pushing it to ICR"
        required: false
        type: boolean
        default: true
      scan_fail_if_overdue:
        description: "Set to true to prevent images with overdue vulnerabilities from being pushed to ICR"
        required: false
        type: boolean
        default: true
      docker_target:
        description: "Build target for multi-stage docker build"
        default: "monkey-patched"
        required: false
        type: string
      docker_context:
        description: "Build context directory"
        default: "."
        required: false
        type: string
      docker_file:
        description: "Path to the Dockerfile"
        default: ""
        required: false
        type: string
      docker_secrets:
        description: "List of secrets to expose to the build (e.g., key=string, GIT_AUTH_TOKEN=mytoken)"
        required: false
        type: string
      push:
        description: "Should the docker image be pushed to ICR"
        default: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') }}
        required: false
        type: boolean
      maximize_free_space:
        description: "Set to true to maximize space on github workflow runners"
        required: false
        type: boolean
        default: false
      maximize_free_space_extreme:
        description: "Set to true to maximize space on github workflow runners (extreme)"
        required: false
        type: boolean
        default: false
      builder_parallelism:
        description: "Set the number of parallel builds to run"
        required: false
        default: 0
        type: number
      submodules:
        description: "How to handle submodules in checkout (recursive, true, or false)"
        required: false
        type: string
        default: "recursive"
      test_container_image:
        description: "Set to true if your repo has .github/workflows/test_container_image/action.yml"
        required: false
        type: boolean
        default: false
      autorelease:
        description: "Set to false to stop a merge to the default branch from creating a release"
        required: false
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        required: false
      OBAN_KEY_FINGERPRINT:
        required: false
      OBAN_LICENSE_KEY:
        required: false
      ICR_USERNAME:
        required: false
      ICR_PASSWORD:
        required: false
      GHEC_NPM_REGISTRY_TOKEN:
        required: false
      TRAVIS_API_TOKEN:
        required: false
      CONTAINER_IMAGE_SCAN_RESULT_COS_API_KEY:
        required: false
      IBM_CLOUD_API_KEY:
        required: false
      SKILLS_NETWORK_BOT_APP_ID:
        required: false
      SKILLS_NETWORK_BOT_PRIVATE_KEY:
        required: false

jobs:
  # Creates a release when a merge to the default branch asks for one.
  #
  # Asking is done in the pull request. The organization pull request template has a "Release
  # Impact" section with four checkboxes: major, minor, patch and no release. Each box carries a
  # hidden marker like <!-- bump:minor -->, and the ticked marker is what this job reads from the
  # pull request body after the merge. A tick on major, minor or patch asks for a release of that
  # size. bump_of() below has the exact rules, including what an unticked section means.
  #
  # The version comes from the newest release tag, bumped by the biggest tick merged since it.
  # This job pushes that tag and stops. The tag push starts a run of this same workflow, and that
  # run builds and pushes. The tag run creates nothing itself, because a tag is
  # not the default branch (so no infinite loops). 
  release:
    name: create the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only a merge to the default branch can be a release. Every other run (pull requests,
    # tags, schedules, dispatches) skips this job without taking a runner, and the build sees
    # an empty output (which means "not tagged").
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && inputs.autorelease
    outputs:
      # true once a release tag covers this commit, so the build job skips
      tagged: ${{ steps.release.outputs.tagged }}
    steps:
      # The bot credentials are organization secrets scoped to private repositories, so a
      # public repository reads them as empty. A tag pushed with the default token raises
      # no push event, so the build would never run and the release would ship nothing.
      # Build normally instead, and say why. A job-level if cannot read secrets, so this
      # check has to be a step.
      - id: gate
        env:
          APP_ID: ${{ secrets.SKILLS_NETWORK_BOT_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No release: the bot credentials are not visible here, so a tag would build nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - id: token
        if: steps.gate.outputs.go == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SKILLS_NETWORK_BOT_APP_ID }}
          private-key: ${{ secrets.SKILLS_NETWORK_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          # Checking out with the app token is what makes the tag push below start a build. A
          # push made with the default token starts nothing at all.
          token: ${{ steps.token.outputs.token }}

      - id: release
        if: steps.gate.outputs.go == 'true'
        env:
          # Reads go through the default token. The app token only pushes the tag and makes
          # the release.
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Without this, a failed gh inside $(...) hands back an empty string and the script
          # carries on as if the answer were "nothing".
          shopt -s inherit_errexit

          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          stop() { say "No release: $1."; exit 0; }

          # A newest release older than this is stale, and only the merging pull request is
          # counted. See the tag loop.
          stale_days=90

          # The pull request a commit came from, or nothing for a commit pushed straight to the
          # branch. 
          #
          # GitHub links a commit to its pull request a few seconds after the push, so an empty
          # answer straight after a merge is not definitive so we check a few times. 
          # Older commits in the range ask once: their links settled long ago, and a range can
          # hold dozens of commits with no pull request at all, each of which would otherwise
          # wait the full time. After that, try the "(#123)" a squash merge leaves at the end of
          # its subject, and only trust it if that pull request really merged as this commit.
          #
          # A commit can belong to two pull requests: one into a feature branch, then the one
          # that took that branch into the default branch. The merged one into the default
          # branch is the vote. Anything else is a fallback.
          pr_of() {
            local sha=$1 subject=$2 attempts=$3 pr="" attempt guess merged_as
            for (( attempt = 1; attempt <= attempts; attempt++ )); do
              pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                | jq -r --arg base "$DEFAULT_BRANCH" \
                    '(map(select(.base.ref == $base and .merged_at != null)) | .[0].number) // .[0].number // empty')
              [ -n "$pr" ] && break
              [ "$attempt" = "$attempts" ] || sleep 5
            done
            if [ -z "$pr" ]; then
              guess=$(sed -nE 's/.*\(#([0-9]+)\)[[:space:]]*$/\1/p' <<<"$subject")
              if [ -n "$guess" ]; then
                merged_as=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$guess" --jq '.merge_commit_sha' 2>/dev/null || true)
                [ "$merged_as" = "$sha" ] && pr=$guess
              fi
            fi
            echo "$pr"
          }

          # A box counts only when it is ticked and carries its marker on the same line. The
          # labels can then be reworded freely.          #
          ticked() {
            grep -qiE "^[[:space:]]*-[[:space:]]*\[x\].*<!--[[:space:]]*bump:$1[[:space:]]*-->" <<<"$body"
          }
          has_boxes() {
            grep -qiE "<!--[[:space:]]*bump:(major|minor|patch|none)[[:space:]]*-->" <<<"$body"
          }

          # How big a release one pull request asks for, printed as "<bump> <why>", where bump
          # is major, minor, patch or none. Biggest wins, so two ticks is not ambiguous.
          #
          # The two unticked cases are deliberately opposite. Boxes present with none ticked
          # means somebody took the tick out and chose nothing, so assume the change can break
          # something. No boxes at all means this repository's template has not been updated,
          # so nothing is released. Releasing anything there would
          # tag, build and ship a deploy bump for every merge, including doc and CI changes,
          # in every repository that has not adopted the template yet.
          bump_of() {
            local pr=$1 pull author
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
            author=$(jq -r '.user.login' <<<"$pull")
            case "$author" in
              'dependabot[bot]'|'ibm-mend-app[bot]'|'skills-network-bot[bot]')
                echo "none #$pr was raised by $author"; return ;;
            esac
            body=$(jq -r '.body // ""' <<<"$pull" | tr -d '\r')
            if   ticked major; then echo "major #$pr is ticked major"
            elif ticked minor; then echo "minor #$pr is ticked minor"
            elif ticked patch; then echo "patch #$pr is ticked patch"
            elif ticked none;  then echo "none #$pr is ticked no release"
            elif has_boxes;    then echo "major #$pr has the boxes with none ticked, so it counts as breaking"
            else echo "none #$pr carries no release impact section, so this repository's template needs updating"
            fi
          }

          rank() { case $1 in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }

          # Every tag on the remote as "<commit> <name>", with no history fetched. An annotated
          # tag is listed twice: once as the tag object, then peeled to its commit as
          # "<name>^{}". The peeled line comes second and wins.
          read_tags() {
            tags=$(git ls-remote --tags origin | awk '{
              name = $2; sub("^refs/tags/", "", name)
              if (sub(/\^\{\}$/, "", name) || !(name in commit)) commit[name] = $1
            } END { for (name in commit) print commit[name], name }')
            finals=$(awk '$2 ~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/' <<<"$tags")
          }

          # Makes sure a tag this bot pushed has its GitHub release. A run that died between
          # pushing the tag and making the release gets finished here by the next run. Tags
          # somebody pushed by hand are left alone.
          make_release() {
            local tag=$1 obj tagger=""
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq 'select(.object.type == "tag") | .object.sha') || return 1
            if [ -n "$obj" ]; then
              tagger=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq '.tagger.name') || return 1
            fi
            [ "$tagger" = "skills-network-bot[bot]" ] || return 0
            if GH_TOKEN=$BOT_TOKEN gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists."
            else
              GH_TOKEN=$BOT_TOKEN gh release create "$tag" --title "$tag" --generate-notes --verify-tag || return 1
            fi
          }

          publish() {
            make_release "$1" || echo "::warning::Could not make sure $1 has a GitHub release. The next run tries again."
          }

          pr=$(pr_of "$GITHUB_SHA" "$(head -n1 <<<"$COMMIT_MESSAGE")" 4)
          if [ -n "$pr" ]; then
            verdict=$(bump_of "$pr")
            read -r own why <<<"$verdict"
            declare -A bumps=(["$pr"]="$own")
          else
            own=none why="this commit belongs to no pull request, so it asks for nothing"
            declare -A bumps=()
          fi
          say "$why."

          git config user.name  "skills-network-bot[bot]"
          git config user.email "skills-network-bot[bot]@users.noreply.github.com"

          # Each attempt reads the tags and the head of the branch, then
          # tries to push the next version. Git refuses to push a tag name that
          # already exists, so two runs racing cannot both get one version. The loser tries again.
          #
          # Releasing the head, not this commit, is what makes that safe. Whichever run wins
          # covers every merge up to the head, sized by the biggest bump among them. A slow run
          # then loses nothing, and versions only ever go up. It also means a re-run, or a
          # caller that uses this workflow twice (one image each), finds the head tagged and
          # doesn't try to create a tag.
          #
          # The size is the biggest tick across every pull request merged since that tag, not
          # just the one that set this run off.
          #
          # So any merge sweeps up whatever is sitting untagged behind it. A dependabot merge
          # asks for nothing on its own, but it still releases a feature that merged days ago
          # and never got a tag. Count only the triggering pull request and that feature waits
          # for the next human merge, which on a quiet repository is a week of dependency
          # bumps away.
          #
          # A repository whose newest release is stale is the exception. See below.
          for attempt in 1 2 3 4 5; do
            read_tags
            tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')

            at_tip=$(awk -v sha="$tip" '$1 == sha { print $2; exit }' <<<"$finals")
            if [ -n "$at_tip" ]; then
              say "$at_tip already covers the tip of $DEFAULT_BRANCH."
              echo "tagged=true" >> "$GITHUB_OUTPUT"
              publish "$at_tip"
              exit 0
            fi

            core=$(awk '{ sub(/^v/, "", $2); print $2 }' <<<"$finals" \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)

            if [ -z "$core" ]; then
              # No base means no range to scan, so this merge is the only vote.
              bump=$own
              [ "$bump" != none ] || stop "$why, and there are no release tags here yet"
              tag="0.1.0"
              say "No release tags here yet, so this starts at $tag."
            else
              # Release tags here are bare numbers, so the core is already the tag name.
              # base is handed to the compare range and the commit lookup below, so it has to
              # name a tag that really exists. A repository tagging vX.Y.Z would 404 there.
              base="$core"
              publish "$base"

              # A stale newest release means nothing merged since it has asked for a release:
              # this repository is not on the template yet, or it went quiet. Either way the range
              # back to it can be hundreds of commits, and every merge would pay an API call
              # per commit and hold the build up while it did. So only this merge is counted.
              # A repository that never asks for a release costs a handful of calls per merge,
              # and one that does gets a fresh tag, after which the full scan is cheap.
              base_sha=$(awk -v name="$base" '$2 == name { print $1; exit }' <<<"$finals")
              base_date=$(gh api "repos/$GITHUB_REPOSITORY/commits/$base_sha" --jq '.commit.committer.date')
              base_age=$(( ( $(date +%s) - $(date -d "$base_date" +%s) ) / 86400 ))
              if [ "$base_age" -gt "$stale_days" ]; then
                bump=$own
                [ "$bump" != none ] || stop "$why, and $base is $base_age days old, so nothing merged before this is counted"
                counted="$base is $base_age days old, so only this merge ($bump) is counted"
              else
                # Rebase and merge commits put several commits in the range for one pull
                # request, so each pull request is read once. bumps caches the verdicts, and
                # already holds this merge's own.
                commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$base...$tip" \
                  --jq '.commits[] | [.sha, (.commit.message | split("\n")[0])] | @tsv')
                bump=none
                while IFS=$'\t' read -r sha subject; do
                  [ -n "$sha" ] || continue
                  if [ "$sha" = "$GITHUB_SHA" ]; then p=$pr; else p=$(pr_of "$sha" "$subject" 1); fi
                  [ -n "$p" ] || continue
                  if [ -z "${bumps[$p]+set}" ]; then
                    verdict=$(bump_of "$p")
                    read -r b _ <<<"$verdict"
                    bumps[$p]=$b
                  fi
                  if [ "$(rank "${bumps[$p]}")" -gt "$(rank "$bump")" ]; then bump=${bumps[$p]}; fi
                done <<<"$commits"

                # Nothing in the range asks for a release. That covers a merge that asked for
                # none, and a merge that asked for one but is not in the range because $base
                # already has it. Nothing is lost by letting the ordinary build run.
                [ "$bump" != none ] || stop "nothing merged since $base asks for a release"
                counted="the biggest bump merged since is $bump"
              fi

              IFS=. read -r MA MI PA <<<"$core"
              case "$bump" in
                major) MA=$((MA + 1)); MI=0; PA=0 ;;
                minor) MI=$((MI + 1)); PA=0 ;;
                patch) PA=$((PA + 1)) ;;
              esac
              tag="${MA}.${MI}.${PA}"
              say "Newest release is $base, and $counted, so this is $tag."
            fi

            # Annotated, so the tagger is recorded and anybody looking can tell automation
            # from somebody's laptop. make_release() relies on that tagger too.
            git fetch -q --depth=1 origin "$tip"
            git tag -a "$tag" "$tip" -m "Release $tag ($bump)"
            if git push origin "refs/tags/$tag" 2>"$RUNNER_TEMP/push.err"; then
              echo "tagged=true" >> "$GITHUB_OUTPUT"
              publish "$tag"
              say "Release [$tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag) at $tip."
              exit 0
            fi

            cat "$RUNNER_TEMP/push.err" >&2
            grep -q "already exists" "$RUNNER_TEMP/push.err" || exit 1
            git tag -d "$tag" >/dev/null
            echo "Another run pushed $tag first. Reading the tags again."
            sleep $((attempt * 3))
          done

          echo "::error::Another run pushed the same version first, five times in a row."
          exit 1

  needs-scan-for-vulnerabilities:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.needs-scan-for-vulnerabilities.outputs.skip }}
    steps:
      - id: needs-scan-for-vulnerabilities
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "BRANCH_NAME=$BRANCH_NAME"
          if [[ "$BRANCH_NAME" =~ ^dependabot.* || "$BRANCH_NAME" =~ ^whitesource-remediate.* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [needs-scan-for-vulnerabilities, release]
    # A merge that creates a tag builds nothing here. The tag push starts a run of its own, and
    # that run builds, pushes, signs and announces. Building in both would make the same image
    # twice. A failed release job still lets this run, so a GitHub hiccup costs a release,
    # not the build.
    if: ${{ !cancelled() && needs.needs-scan-for-vulnerabilities.result == 'success' && needs.release.outputs.tagged != 'true' }}
    name: docker image
    runs-on: ubuntu-latest
    outputs:
      # The tag the image is actually pushed under
      version: ${{ steps.meta.outputs.version }}
      # The git tag as pushed
      ref: ${{ github.ref_name }}
    steps:
      - name: Check if tag is a non-production release (e.g. 1.2.3-dev.0, 1.2.3-rc.0)
        id: check-ref
        run: |
          if [[ "${{ github.ref_name }}" =~ [a-zA-Z] ]]; then
            echo "has_alpha=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_alpha=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize free space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          dotnet: true
          android: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
        if: ${{ inputs.maximize_free_space && !inputs.maximize_free_space_extreme }}

      - name: Maximize free space on runner (extreme)
        uses: jlumbroso/free-disk-space@main
        with:
          dotnet: true
          android: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
          tool-cache: true
        if: ${{ inputs.maximize_free_space && inputs.maximize_free_space_extreme }}

      - name: Get latest release tag
        id: latest-release
        uses: joutvhu/get-release@v1
        with:
          latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'schedule' }}

        # base release is the release without any security patch suffix
        # base release of x.y.z is x.y.z
        # base release is x.y.z-YYYYMMDD is x.y.z
      - name: Get base release tag
        id: base-release
        run: |
          echo "base-release=$(echo '${{ steps.latest-release.outputs.tag_name }}' | sed -r 's/(-[0-9]{8})$//')" >> $GITHUB_OUTPUT

      - name: Print release tag
        run: |
          echo "${{ steps.base-release.outputs.base-release }}"
        if: ${{ github.event_name == 'schedule' }}

      # If this is a scheduled (nightly) build use latest release tag
      # Otherwise use referenced/default branch/tag
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}
          ref: ${{ steps.latest-release.outputs.tag_name }}
        if: ${{ github.event_name == 'schedule' }}
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}
        if: ${{ github.event_name != 'schedule' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = ${{ inputs.builder_parallelism }}

      - name: Login to Global ICR
        uses: docker/login-action@v3
        with:
          registry: icr.io
          # These are organization-wide secrets,
          # so you don't need to configure them on your own
          username: ${{ secrets.ICR_USERNAME }}
          password: ${{ secrets.ICR_PASSWORD }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.image }}
          # Info: https://github.com/docker/metadata-action#tags-input
          #   - Tag for semantically versioned releases
          #   - Nightly tag ('<latest tag>-YYYYMMDD')
          #   - Manual tag (trigger from Github UI)
          tags: |
            type=semver,pattern={{version}}
            type=schedule,pattern=${{ steps.base-release.outputs.base-release }}-{{date 'YYYYMMDD'}}
            type=raw,value=manual,suffix=${{ github.event.inputs.suffix }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr

      - name: Should we cache
        id: should-cache
        run: |
          if [[ $(date +%a) == 'Sun' ]]; then
            echo "cache-from=" >> $GITHUB_OUTPUT
            echo "cache-to=" >> $GITHUB_OUTPUT
          else
            # disable caching on all days until we confirm our "Requires Manual Intervention"
            # issues aren't due to caching issues
            echo "cache-from=" >> $GITHUB_OUTPUT
            echo "cache-to=" >> $GITHUB_OUTPUT
            # echo "cache-to=type=gha" >> $GITHUB_OUTPUT
            # echo "cache-to=type=gha,mode=max" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Skills Network Certificate Authority Public Certificate
        run: |
          echo "${{ secrets.ROOT_CA_CERTIFICATE_BASE64 }}" | base64 -d > rootCA.crt

      # TODO: Re enable when Twistlock is back up
      # - name: Build and push image to scan
      #   if: ${{ needs.needs-scan-for-vulnerabilities.outputs.skip == 'false' && inputs.scan_image_enabled && ( github.ref_type != 'tag' || steps.check-ref.outputs.has_alpha == 'false' ) }}
      #   uses: docker/build-push-action@v5
      #   with:
      #     # If your Dockerfile is not present in the root directory
      #     # change it to the correct subdirectory name
      #     context: ${{ inputs.docker_context }}
      #     file: ${{ inputs.docker_file }}
      #     target: ${{ inputs.docker_target }}
      #     push: true
      #     tags: ${{ inputs.image }}:scan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      #     labels: ${{ steps.meta.outputs.labels }}
      #     cache-from: ${{ steps.should-cache.outputs.cache-from }}
      #     cache-to: ${{ steps.should-cache.outputs.cache-to }}
      #     secrets: |
      #       "oban_key_fingerprint=${{ secrets.OBAN_KEY_FINGERPRINT }}"
      #       "oban_license_key=${{ secrets.OBAN_LICENSE_KEY }}"
      #       "IBM_CLOUD_API_KEY=${{ secrets.IBM_CLOUD_API_KEY }}"
      #       ${{ inputs.docker_secrets }}
      #     build-args: |-
      #       SN_GITHUB_NPM_TOKEN=${{ secrets.GHEC_NPM_REGISTRY_TOKEN }}
      #       SN_GITHUB_NPM_REGISTRY=https://npm.pkg.github.com

      # - name: Scan image
      #   if: ${{ needs.needs-scan-for-vulnerabilities.outputs.skip == 'false' && inputs.scan_image_enabled && ( github.ref_type != 'tag' || steps.check-ref.outputs.has_alpha == 'false' ) }}
      #   uses: ibm-skills-network/action-scan-container-image@main
      #   with:
      #     image: ${{ inputs.image }}:scan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      #     image_scan_cos_sps_toolchain_api_token: ${{ secrets.CONTAINER_IMAGE_SCAN_RESULT_COS_API_KEY }}
      #     fail_if_overdue: ${{ inputs.scan_fail_if_overdue }}

      - name: Check image exist on ICR
        id: check-image
        run: |
          IMAGE="${{ inputs.image }}:${{ github.ref_name }}"
          if docker manifest inspect "$IMAGE" &> /dev/null ; then
            echo IMAGE_EXISTS=true >> "$GITHUB_ENV"
            echo "Image found in ICR: ${IMAGE}"
          else
            echo IMAGE_EXISTS=false >> "$GITHUB_ENV"
            echo "Image not found in ICR: ${IMAGE}"
          fi

      - name: Fail if image already exists
        run: |
          if [ "$IMAGE_EXISTS" == "true" ]; then
            echo "Image already exists. Failing the release."
            exit 1
          fi
        env:
          IMAGE_EXISTS: ${{ env.IMAGE_EXISTS }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          # If your Dockerfile is not present in the root directory
          # change it to the correct subdirectory name
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          target: ${{ inputs.docker_target }}
          load: ${{ inputs.test_container_image }} # Images will be loaded when you run container test 
          push: ${{ !inputs.test_container_image && inputs.push }} # If you are testing, pushing will happen after your test
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.should-cache.outputs.cache-from }}
          cache-to: ${{ steps.should-cache.outputs.cache-to }}
          secrets: |
            "oban_key_fingerprint=${{ secrets.OBAN_KEY_FINGERPRINT }}"
            "oban_license_key=${{ secrets.OBAN_LICENSE_KEY }}"
            "IBM_CLOUD_API_KEY=${{ secrets.IBM_CLOUD_API_KEY }}"
            ${{ inputs.docker_secrets }}
          build-args: |-
            SN_GITHUB_NPM_TOKEN=${{ secrets.GHEC_NPM_REGISTRY_TOKEN }}
            SN_GITHUB_NPM_REGISTRY=https://npm.pkg.github.com
        if: env.IMAGE_EXISTS == 'false'

      - name: run container test
        if: ${{ inputs.test_container_image && env.IMAGE_EXISTS == 'false' }}
        uses: ./.github/workflows/test_container_image
        with:
          image: ${{ steps.build-push.outputs.imageid }}
          ibm-cloud-api-key: ${{ secrets.IBM_CLOUD_API_KEY }}

      # This action is triggered if you are testing you image
      - name: Push tested image 
        id: push-image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          target: ${{ inputs.docker_target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.should-cache.outputs.cache-from }}
          cache-to: ${{ steps.should-cache.outputs.cache-to }}
          secrets: |
            "oban_key_fingerprint=${{ secrets.OBAN_KEY_FINGERPRINT }}"
            "oban_license_key=${{ secrets.OBAN_LICENSE_KEY }}"
            "IBM_CLOUD_API_KEY=${{ secrets.IBM_CLOUD_API_KEY }}"
            ${{ inputs.docker_secrets }}
          build-args: |-
            SN_GITHUB_NPM_TOKEN=${{ secrets.GHEC_NPM_REGISTRY_TOKEN }}
            SN_GITHUB_NPM_REGISTRY=https://npm.pkg.github.com
        if: ${{ inputs.test_container_image && inputs.push }}

      - uses: sigstore/cosign-installer@main
        if: ${{ inputs.push }}

      - name: Write signing key to disk
        if: ${{ inputs.push }}
        run: echo "${{ secrets.CONTAINER_IMAGE_SIGNING_PRIVATE_KEY }}" > cosign.key

      - name: Sign container image
        if: ${{ inputs.push }}
        run: |
          cosign sign --key cosign.key \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            ${{ inputs.image }}@${{ steps.push-image.outputs.digest || steps.build-push.outputs.digest }}
        env:
          COSIGN_PASSWORD: ${{ secrets.CONTAINER_IMAGE_SIGNING_PASSWORD }}

  notify-deploy-repos:
    needs: build
    # Nothing here should cause a failure for a run whose image is already pushed and signed. The release
    # worked; only the announcement did not. 
    continue-on-error: true
    # Release candidates are not announced, e.g. 14.42.2-rc.0 is skipped and 14.42.2 is announced.
    # Which services actually get bumped is decided by the deploy repos, each of which
    # annotates the image tags it wants tracked.
    #
    # !cancelled() with an explicit result check, because a job-level if with no status function
    # gets an implicit success(), and success() looks at every job upstream, not just the direct
    # needs. The release job is skipped on every tag run, which would make success() false here
    # and skip the announcement for every release.
    if: ${{ !cancelled() && needs.build.result == 'success'
            && inputs.push && startsWith(github.ref, 'refs/tags/')
            && needs.build.outputs.version != ''
            && !contains(needs.build.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - id: creds
        env:
          APP_ID: ${{ secrets.SKILLS_NETWORK_BOT_APP_ID }}
        run: |
          # The bot credentials are org secrets scoped to private repositories, so a public
          # repo reads them as empty. Stop quietly rather than fail the token step on every
          # release there. This is a step because the secrets context is not available to a
          # job-level if.
          if [ -n "$APP_ID" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No bot credentials visible here, so nothing is announced."
          fi

      - id: token
        if: steps.creds.outputs.have == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SKILLS_NETWORK_BOT_APP_ID }}
          private-key: ${{ secrets.SKILLS_NETWORK_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Tell every deploy repo that this released
        if: steps.creds.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          REF: ${{ needs.build.outputs.ref }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg image "$IMAGE" \
                           --arg version "$VERSION" --arg ref "$REF" \
            '{event_type:"release-published",
              client_payload:{repo:$repo, image:$image, version:$version, ref:$ref}}')

          targets=$(gh api -X GET search/repositories \
            -f q="org:$OWNER topic:deployment" --jq '.items[].full_name')

          for target in $targets; do
            gh api -X POST "repos/$target/dispatches" --input - <<<"$payload" \
              && echo "told $target" \
              || echo "::warning::could not tell $target about $VERSION"
          done
